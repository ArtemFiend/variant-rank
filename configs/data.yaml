dataset:
  source: clinvar
  url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz
  checksum_url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz.md5
  assembly: GRCh38
  high_confidence_only: false
  exclude_ambiguous_labels: true
  chunk_size: 100000

normalization:
  chromosome_prefix: false
  minimal_representation: true
  left_align_indels: true

annotation:
  assembly: GRCh38
  cache_dir: data/external/vep
  cache_version: 116
  docker_image: ensemblorg/ensembl-vep:release_116.1
  forks: 4
  rest_batch_size: 200
