[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "variantrank"
version = "0.1.0"
description = "Research-grade ML system for genetic variant pathogenicity prioritization"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Artem Ponomarev", email = "artemfiend@gmail.com" },
]
keywords = ["bioinformatics", "genomics", "machine-learning", "vcf", "clinvar"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<4",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
variantrank = "variantrank.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/variantrank"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/variantrank"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["variantrank"]
